name: Publish Maven Artifact to AWS CodeArtifact

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      repo_endpoint:
        required: true
        type: string
      domain:
        required: true
        type: string
      domain_owner:
        required: true
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Install JDK for Maven build
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Apply version to pom.xml
      - name: Update version in pom.xml
        run: |
          mvn versions:set -DnewVersion="${{ inputs.version }}"
          mvn versions:commit

      # Place the central settings.xml
      - name: Copy Maven settings.xml
        run: |
          mkdir -p ~/.m2
          cp settings.xml ~/.m2/settings.xml

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # Pull the CodeArtifact token and substitute into settings.xml
      - name: Inject CodeArtifact token
        id: auth
        run: |
          TOKEN=$(aws codeartifact get-authorization-token \
            --domain "${{ inputs.domain }}" \
            --domain-owner "${{ inputs.domain_owner }}" \
            --query authorizationToken --output text)

          # Replace TOKEN placeholder inside settings.xml
          sed -i "s|CODEARTIFACT_TOKEN|$TOKEN|g" ~/.m2/settings.xml

      - name: Build & Deploy
        run: mvn clean deploy -DskipTests \
          -DaltDeploymentRepository=aws::default::${{ inputs.repo_endpoint }}
