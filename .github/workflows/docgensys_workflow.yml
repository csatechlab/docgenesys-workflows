name: Publish to AWS CodeArtifact

on:
  workflow_call:
    inputs:
      version:
        description: "Version to set in pom.xml"
        required: true
        type: string

      target_branch:
        description: "Branch of service repo to checkout and build"
        required: true
        type: string

      repo_endpoint:
        description: "Complete CodeArtifact repository endpoint URL"
        required: true
        type: string

      domain:
        description: "CodeArtifact domain"
        required: true
        type: string

      domain_owner:
        description: "AWS account ID that owns the domain"
        required: true
        type: string

    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------------
      # 1. Checkout service repo code
      # ---------------------------------------------------------------
      - name: Checkout service repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0

       # Checkout this workflow repository (to access settings.xml)
      - name: Checkout workflow repository
        uses: actions/checkout@v3
        with:
          repository: csatechlab/docgenesys-workflows
          ref: main
          path: workflow-repo    

      # ---------------------------------------------------------------
      # 2. Install JDK 21 for compilation
      # ---------------------------------------------------------------
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      # ---------------------------------------------------------------
      # 3. Apply requested version to pom.xml
      # ---------------------------------------------------------------
      - name: Update version in pom.xml
        run: |
          echo "Applying version: ${{ inputs.version }}"
          mvn versions:set -DnewVersion="${{ inputs.version }}"
          mvn versions:commit

      # ---------------------------------------------------------------
      # 4. Display new version for confirmation
      # ---------------------------------------------------------------
      - name: Confirm updated pom version
        run: mvn help:evaluate -Dexpression=project.version -q -DforceStdout

      # ---------------------------------------------------------------
      # 5. Place centralized settings.xml in Maven home
      # ---------------------------------------------------------------
      - name: Copy central Maven settings.xml
        run: |
          mkdir -p ~/.m2
          cp workflow-repo/settings.xml ~/.m2/settings.xml

      # ---------------------------------------------------------------
      # 6. Configure AWS creds for CodeArtifact
      # ---------------------------------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # ---------------------------------------------------------------
      # 7. Fetch CodeArtifact authorization token
      # ---------------------------------------------------------------
      - name: Fetch CodeArtifact token
        id: auth
        run: |
          TOKEN=$(aws codeartifact get-authorization-token \
            --domain "${{ inputs.domain }}" \
            --domain-owner "${{ inputs.domain_owner }}" \
            --query authorizationToken --output text)

          if [ -z "$TOKEN" ]; then
            echo "❌ Unable to fetch CodeArtifact token"
            exit 1
          fi

          # Inject token into settings.xml
          sed -i "s|CODEARTIFACT_TOKEN|$TOKEN|g" ~/.m2/settings.xml

      # ---------------------------------------------------------------
      # 8. Build & Publish artifact to CodeArtifact
      # ---------------------------------------------------------------
      - name: Build and Deploy to CodeArtifact
        run: |
          echo "Publishing to: ${{ inputs.repo_endpoint }}"
          mvn clean deploy -DskipTests \
            -DaltDeploymentRepository=aws::default::${{ inputs.repo_endpoint }}
